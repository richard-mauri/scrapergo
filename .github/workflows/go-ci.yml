name: Go CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Report formatting debt (non-blocking)
        run: |
          git ls-files '*.go' | xargs gofmt -l
      - name: Run tests
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...

      - name: Run Readability structure experiments
        run: |
          set -eu
          for fixture in semantic-live flattened-live ordinary-article; do
            mkdir -p "readability-probe-results/$fixture"
            go run ./cmd/readabilityprobe \
              -input "testdata/readability/$fixture.html" \
              -url "https://example.org/$fixture" \
              -out "readability-probe-results/$fixture" > "readability-probe-results/$fixture/console.json"
            echo "=== $fixture: source vs Readability HTML ==="
            cat "readability-probe-results/$fixture/report.json"
            echo "=== $fixture: RenderText sample ==="
            head -c 1400 "readability-probe-results/$fixture/readability.txt"
            echo
          done
      - name: Smoke-test retained offline diagnostic tools
        run: |
          set -eu
          fixture="testdata/diagnostics/offline-article.html"
          base="https://example.org/harbor-navigation"
          mkdir -p diagnostic-smoke-results
          go run ./cmd/structureprobe -input "$fixture" -url "$base" > diagnostic-smoke-results/structureprobe.json
          go run ./cmd/structureprobe -input "$fixture" -url "$base" -structure-trace > diagnostic-smoke-results/structure-trace.json
          go run ./cmd/selectedstructure -input "$fixture" -url "$base" > diagnostic-smoke-results/selectedstructure.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("diagnostic-smoke-results")
          def load(name):
              with (root / name).open(encoding="utf-8") as stream:
                  return json.load(stream)

          full = load("structureprobe.json")
          assert full["status"] == "candidate", full
          assert len(full.get("items", [])) >= 2, full
          assert any(item["kind"] == "figure" for item in full["items"]), full
          trace = load("structure-trace.json")
          assert trace["status"] == "candidate", trace
          assert len(trace.get("images", [])) >= 1, trace
          assert all("imageIndex" in item and "pattern" in item for item in trace["images"]), trace
          selected = load("selectedstructure.json")
          assert selected["status"] == "offline-comparison", selected
          assert selected["selectedHTMLImages"] >= 1, selected
          assert isinstance(selected["selectedHTMLKinds"], dict), selected
          assert "sourceSelectedImageAlignment" in selected, selected
          assert "baselineImageAlignment" in selected, selected
          assert isinstance(selected["baselineImageStages"], list), selected
          print("Both offline diagnostic commands produced valid, structurally checked JSON.")
          PY
      - name: Upload Readability experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readability-structure-results
          path: readability-probe-results/
          if-no-files-found: warn

name: Go CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Report formatting debt (non-blocking)
        run: |
          git ls-files '*.go' | xargs gofmt -l
      - name: Run tests
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...

      - name: Run Readability structure experiments
        run: |
          set -eu
          for fixture in semantic-live flattened-live ordinary-article; do
            mkdir -p "readability-probe-results/$fixture"
            go run ./cmd/readabilityprobe \
              -input "testdata/readability/$fixture.html" \
              -url "https://example.org/$fixture" \
              -out "readability-probe-results/$fixture" > "readability-probe-results/$fixture/console.json"
            echo "=== $fixture: source vs Readability HTML ==="
            cat "readability-probe-results/$fixture/report.json"
            echo "=== $fixture: RenderText sample ==="
            head -c 1400 "readability-probe-results/$fixture/readability.txt"
            echo
          done
      - name: Probe live CBS HTML (diagnostic only, non-blocking)
        continue-on-error: true
        run: |
          set -eu
          capture="$(mktemp -d)"
          trap 'rm -rf "$capture"' EXIT
          url='https://www.cbsnews.com/live-updates/iran-war-trump-us-strait-hormuz-persian-gulf/'
          echo "Requesting live publisher HTML over HTTPS (not committed or uploaded)"
          status="$(curl -sSL --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 30 --max-filesize 5000000 -A 'Mozilla/5.0' -w '%{http_code}' -o "$capture/publisher.html" "$url")"
          echo "HTTP status: $status; received bytes: $(wc -c < "$capture/publisher.html")"
          test "$status" = 200
          go run ./cmd/readabilityprobe -input "$capture/publisher.html" -url "$url" -out "$capture/output" > "$capture/report.json"
          python3 - "$capture/report.json" "$capture/output/readability.txt" <<'PY'
          import json, sys, re
          with open(sys.argv[1], encoding='utf8') as f: r = json.load(f)
          for name in ('source', 'readabilityHTML'):
              x = r[name]
              print(f"{name}: headings={len(x['headings'])}, time_elements={len(x['times'])}, article_containers={x['articles']}, section_containers={x['sections']}")
          for x in r['readabilityHTML']['headings'][:3]:
              print("preserved heading tag:", x['tag'])
          with open(sys.argv[2], encoding='utf8') as f: txt=f.read()
          print("Readability text bytes:", len(txt.encode('utf8')))
          print("Relative-time tokens:", len(re.findall(r'\b\d{1,3}[mhdw] ago\b', txt)))
          headings = ("Adviser to Iran's supreme leader says Tehran now", "Tanker hit by explosion in Strait of Hormuz")
          for label in headings:
              print("Relevant heading:", "adviser" if label.startswith("Adviser") else "tanker")
              for key in ('source','readabilityHTML'):
                  print(" ", key, "heading present:", any(label in x['text'] for x in r[key]['headings']))
              print("  RenderText includes heading text:", label in txt)
          original = {(x['tag'],x['text']) for x in r['source']['headings']}
          kept = {(x['tag'],x['text']) for x in r['readabilityHTML']['headings']}
          print("Exact heading/tag pairs preserved:", len(original & kept), "of", len(original))
          print("Time text preserved:", len({x['text'] for x in r['source']['times']} & {x['text'] for x in r['readabilityHTML']['times']}))
          idx = txt.find("Tanker hit by explosion in Strait of Hormuz")
          if idx >= 0:
              context = txt[max(0,idx-140):idx]
              print("Tanker heading preceded by time-like text:", bool(re.search(r'(?:\d{1,2}:\d{2}\s*[AP]M|\d+[mhdw] ago)\s*$',context)))
              print("Tanker boundary paragraph attached to time:", bool(re.search(r'\w[.!?]\s+\d+[mhdw] ago',context)))
          PY
          echo "Publisher raw capture and transformed output remain temporary and are removed after this step."
      - name: Upload Readability experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readability-structure-results
          path: readability-probe-results/
          if-no-files-found: warn

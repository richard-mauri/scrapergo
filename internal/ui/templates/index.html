<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScraperGo</title>
<style>__READER_CSS__</style>
</head>
<body>
<div class="suite-ambient suite-ambient-one" aria-hidden="true"></div>
<div class="suite-ambient suite-ambient-two" aria-hidden="true"></div>
__SUITE_BANNER__
<main class="shell suite-content">
<form class="controls" id="form"><input type="url" id="url" aria-label="Article URL" placeholder="Paste an article URL (https://...)" required><button class="ui-button" id="read">Read article</button></form>
<p class="hint">Only publicly accessible content. Results depend on the site's HTML and may omit some formatting or media.</p>
<p id="status" class="status" role="status"></p>
<p id="fallback" class="fallback"><a id="original" rel="noopener noreferrer" target="_blank">Open original article in Safari ↗</a></p>
<section class="paynotice" id="paynotice"><h2 id="paytitle">Access Restricted</h2><p id="paymessage">The publisher requires additional access to continue reading.</p><p class="hint" id="paydiagnostic"></p></section>
<article id="paper" class="paper"><div class="mast" id="site"></div><h2 id="title"></h2><div id="meta" class="meta"></div><p id="accessnote" class="hint" role="note" style="display:none"></p><div class="toolbar"><button class="ui-button" id="txt" type="button">Download .txt</button><button class="ui-button" id="md" type="button">Download .md</button><button class="ui-button" id="print" type="button">Print / Save PDF</button></div><div id="hero"></div><div class="content" id="content"></div><p class="source">Original: <a id="source" rel="noopener noreferrer" target="_blank"></a></p></article>
</main>
<script>__SUITE_BANNER_SCRIPT__</script>
<script>__SUITE_AUTH_JS__</script>
<script>__READER_JS__</script>
</body>
</html>

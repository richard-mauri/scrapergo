name: Go CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Report formatting debt (non-blocking)
        run: |
          git ls-files '*.go' | xargs gofmt -l
      - name: Resolve PDF module checksums for draft validation
        run: go mod download -json github.com/giraffesyo/pdf@v0.8.0
      - name: Run tests
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...
